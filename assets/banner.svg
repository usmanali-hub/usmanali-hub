<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="35%" stop-color="#111827" />
      <stop offset="70%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.25" />
    </linearGradient>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 54px;
        font-weight: 800;
        letter-spacing: -0.5px;
        fill: url(#titleGradient);
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: 0.2px;
        fill: #94A3B8;
      }
      .wave-anim1 {
        animation: waveDrift1 10s ease-in-out infinite alternate;
      }
      .wave-anim2 {
        animation: waveDrift2 14s ease-in-out infinite alternate;
      }
      @keyframes waveDrift1 {
        0% { transform: translateY(0px) scaleY(1); }
        50% { transform: translateY(-8px) scaleY(1.05); }
        100% { transform: translateY(0px) scaleY(1); }
      }
      @keyframes waveDrift2 {
        0% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
        100% { transform: translateY(0px); }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="240" fill="url(#bgGradient)" rx="12" />

  <!-- Animated Ambient Wave Layers -->
  <g class="wave-anim1">
    <path d="M 0,160 Q 300,110 600,165 T 1200,150 L 1200,240 L 0,240 Z" fill="url(#wave1)" />
  </g>
  <g class="wave-anim2">
    <path d="M 0,185 Q 350,135 750,190 T 1200,175 L 1200,240 L 0,240 Z" fill="url(#wave2)" />
  </g>

  <!-- Bottom Smooth Contour Wave -->
  <path d="M 0,210 C 300,195 500,225 800,205 C 1000,190 1120,205 1200,200 L 1200,240 L 0,240 Z" fill="#0B0F19" fill-opacity="0.7" />

  <!-- Main Title -->
  <text x="600" y="95" text-anchor="middle" class="title">Usman Ali</text>

  <!-- Professional Subtitle -->
  <text x="600" y="142" text-anchor="middle" class="subtitle">Co-Founder &amp; CTO @ ReplyPops | AI Engineer | ML &amp; Deep Learning | Forward Deployed</text>
</svg>