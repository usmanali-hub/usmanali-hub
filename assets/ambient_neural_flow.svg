<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.15" />
    </linearGradient>
    <style>
      .node { animation: pulse 3s infinite ease-in-out; }
      .drift1 { animation: drift 14s infinite linear; }
      .drift2 { animation: drift 20s infinite linear reverse; }
      .drift3 { animation: drift 16s infinite linear; }
      .wave1 { animation: wave 8s infinite ease-in-out alternate; }
      .wave2 { animation: wave 12s infinite ease-in-out alternate-reverse; }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.6); opacity: 0.95; }
      }
      @keyframes drift {
        0% { transform: translateX(0px); }
        50% { transform: translateX(35px) translateY(-8px); }
        100% { transform: translateX(0px); }
      }
      @keyframes wave {
        0% { transform: translateY(0px) skewX(0deg); }
        50% { transform: translateY(10px) skewX(1.5deg); }
        100% { transform: translateY(0px) skewX(0deg); }
      }
    </style>
  </defs>

  <rect width="1200" height="120" fill="url(#grad)" rx="10" />

  <!-- Animated Ambient Constellation Lines -->
  <g class="wave1">
    <path d="M 0,60 Q 300,15 600,65 T 1200,60" fill="none" stroke="url(#lineGrad)" stroke-width="1.8" />
  </g>
  <g class="wave2">
    <path d="M 0,75 Q 350,110 700,50 T 1200,75" fill="none" stroke="url(#lineGrad)" stroke-width="1.4" stroke-dasharray="5,5" />
  </g>

  <!-- Drifting Floating Neural Nodes -->
  <g class="drift1">
    <circle class="node" cx="120" cy="45" r="3.5" fill="#38BDF8" />
    <circle class="node" cx="280" cy="70" r="2.8" fill="#818CF8" style="animation-delay: 0.5s;" />
    <circle class="node" cx="460" cy="35" r="3.8" fill="#38BDF8" style="animation-delay: 1.2s;" />
    <circle class="node" cx="720" cy="80" r="2.8" fill="#C084FC" style="animation-delay: 1.8s;" />
    <circle class="node" cx="940" cy="40" r="3.5" fill="#38BDF8" style="animation-delay: 0.8s;" />
    <circle class="node" cx="1100" cy="65" r="2.5" fill="#818CF8" style="animation-delay: 1.5s;" />
  </g>

  <g class="drift2">
    <circle class="node" cx="80" cy="85" r="2.5" fill="#C084FC" style="animation-delay: 1.1s;" />
    <circle class="node" cx="220" cy="25" r="3.2" fill="#38BDF8" style="animation-delay: 2.1s;" />
    <circle class="node" cx="390" cy="75" r="2.8" fill="#818CF8" style="animation-delay: 0.3s;" />
    <circle class="node" cx="580" cy="40" r="3.5" fill="#38BDF8" style="animation-delay: 1.7s;" />
    <circle class="node" cx="840" cy="70" r="2.8" fill="#818CF8" style="animation-delay: 0.9s; " />
    <circle class="node" cx="1020" cy="30" r="3.8" fill="#C084FC" style="animation-delay: 2.4s;" />
  </g>

  <g class="drift3">
    <circle class="node" cx="180" cy="55" r="2" fill="#94A3B8" style="animation-delay: 1.4s;" />
    <circle class="node" cx="520" cy="90" r="2.5" fill="#38BDF8" style="animation-delay: 0.7s;" />
    <circle class="node" cx="640" cy="30" r="2.2" fill="#818CF8" style="animation-delay: 2.0s;" />
    <circle class="node" cx="890" cy="55" r="2.6" fill="#38BDF8" style="animation-delay: 1.3s;" />
  </g>
</svg>
